name: .NET Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore InventoryManagement.sln

      - name: Build
        run: dotnet build InventoryManagement.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InventoryManagementSystem.Tests/InventoryManagementSystem.Tests.csproj --configuration Release --no-build --verbosity normal --logger "console;verbosity=normal"
